name: dataflow-intelligence-bi
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow -d dataflow"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - demo-db:/var/lib/postgresql
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://dataflow:dataflow@db:5432/dataflow
      DATAFLOW_ADMIN_TOKEN: ${DATAFLOW_ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 4s
      timeout: 5s
      retries: 30
volumes:
  demo-db:
